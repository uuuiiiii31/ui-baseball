<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NPBドラフト・シミュレーター</title>
<style>
:root{color-scheme:light dark;--bg:#f3f4f7;--cd:#fff;--tx:#181b22;--sb:#667085;--ac:#0b5fff;--ln:#e2e5ea;--ok:#15803d;--ng:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--cd:#1a1d24;--tx:#eef0f4;--sb:#9aa3b2;--ac:#6b96ff;--ln:#2b303b;--ok:#4ade80;--ng:#f87171}}
:root[data-theme=dark]{--bg:#0f1115;--cd:#1a1d24;--tx:#eef0f4;--sb:#9aa3b2;--ac:#6b96ff;--ln:#2b303b;--ok:#4ade80;--ng:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
.w{max-width:520px;margin:0 auto;padding:12px 12px 100px}
h1,h2{margin:8px 0}h1{font-size:22px}h2{font-size:18px}h3{font-size:15px;margin:14px 0 6px}
.s{color:var(--sb);font-size:12px}.c{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:8px 0}
.pc{cursor:pointer}.pc.on{border:2px solid var(--ac);padding:9px 11px}
.h{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}.h span{flex:1}.h em{font-style:normal;font-size:22px;font-weight:700;color:var(--ac)}
.st{display:flex;align-items:center;gap:6px;font-size:12px}.st i{width:56px;font-style:normal;color:var(--sb)}.st u{text-decoration:none;width:44px;text-align:right}
.t{flex:1;height:6px;background:var(--ln);border-radius:3px;overflow:hidden}.t b{display:block;height:100%;background:var(--ac)}
button,select,input{font:inherit}button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px}
button.g{background:var(--cd);color:var(--tx);border:1px solid var(--ln)}button:disabled{opacity:.4}
select,input{background:var(--cd);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px}input{width:100%;box-sizing:border-box}
.bb{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--cd);border-top:1px solid var(--ln)}.bb button{flex:1;max-width:240px}
.r{display:flex;align-items:center;gap:6px}.r div{flex:1}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th,td{padding:4px 4px;text-align:right;border-bottom:1px solid var(--ln)}td:first-child,th:first-child{text-align:left}
.nw{display:inline-block;background:#e11d48;color:#fff;font-size:10px;font-weight:700;padding:0 6px;border-radius:6px;vertical-align:middle;margin-left:4px;line-height:16px}
.scout{display:inline-block;background:var(--ac);color:#fff;font-size:10px;font-weight:700;padding:0 6px;border-radius:6px;vertical-align:middle;margin-left:4px;line-height:16px}.scout.star{background:#e11d48}.scout.gem{background:#b45309}.scout.bake{background:#7c3aed}.cm{margin:2px 0 4px}.cm .scout{margin:0 6px 0 0}.h .nw{flex:none}
.sk{display:inline-block;background:#0f766e;color:#fff;font-size:10px;font-weight:700;padding:0 6px;border-radius:6px;line-height:16px;margin:0 4px 2px 0}.sk.n{background:#6b7280}.big{font-size:26px;font-weight:700}.ng{color:var(--ng)}.me td{font-weight:700;color:var(--ac)}
.nv{display:flex;gap:6px;margin:0 0 6px}.nv button{padding:5px 10px;font-size:13px}.tp{position:fixed;left:12px;right:12px;bottom:80px;background:#111;color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;display:none;z-index:9;max-width:496px;margin:0 auto}.sk{cursor:pointer}.fl{width:100%;height:auto;display:block}.cmpt{display:grid;grid-template-columns:1fr 62px 1fr;gap:4px 6px;align-items:center;font-size:12px}.bar{height:8px;border-radius:4px;background:var(--ac)}
</style></head><body><div class="w" id="a"></div>
<script src="npb-simulator.js"></script></body></html>
